- title: Research Vision
  type: list
  contents:
    - 'My research centers on <b>Infrastructure-Centric World Models (I-WM)</b> — a framework that leverages the unique "temporal depth" of fixed roadside sensors to build rich, evolving representations of traffic environments. This vision unifies my doctoral work on quality-aware multi-LiDAR perception (background modeling → detection → tracking → safety analysis) with emerging directions in V2X cooperative perception and spatial intelligence.'
    - "A second research thrust extends multi-objective optimization methods to EV charging infrastructure and transportation asset management, addressing critical needs in sustainable and intelligent transportation systems."
    - "See preprint: <a href='https://arxiv.org/abs/2604.17651'>arXiv:2604.17651</a>"

