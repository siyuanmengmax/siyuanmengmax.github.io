# Local previews use repository content without fetching demo blog feeds or
# generating responsive images. Production keeps the settings in _config.yml.
url: http://127.0.0.1:4000
external_sources: []
imagemagick:
  enabled: false
# The theme's Twitter sample performs a network request while rendering.
defaults:
  - scope:
      path: assets
    values:
      sitemap: false
  - scope:
      path: _posts/2020-09-28-twitter.md
    values:
      published: false
